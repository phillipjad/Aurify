# Local development services for Aurify.
#
#   docker compose up -d postgres   # just the database (what you need today)
#
# The two LLM sidecars are placeholders: the services are not built yet
# (see docs/adr/0006-llm-sidecars.md). The backend falls back to deterministic
# placeholders when AURIFY_PROMPTGEN_URL / AURIFY_IMAGEGEN_URL are unset, so you
# do not need these to run the API.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    # Optional local overrides. Copy backend/.env.example to backend/.env and
    # edit; the file is gitignored, so credentials stay out of the repo.
    #
    # `environment:` below wins over anything in the file, which is deliberate:
    # the database URL must use the compose service hostname, not the localhost
    # value a developer needs when running the API outside Docker.
    env_file:
      - path: backend/.env
        required: false
    environment:
      AURIFY_DATABASE_URL: postgres://aurify:aurify@postgres:5432/aurify?sslmode=disable
      AURIFY_HTTP_ADDR: :8080
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: aurify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurify
      POSTGRES_USER: aurify
      POSTGRES_PASSWORD: aurify
    ports:
      - '5432:5432'
    volumes:
      # Named volume, but bound to an explicit host directory — see the
      # top-level `volumes:` block at the bottom of this file.
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aurify -d aurify']
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Placeholders for future work (commented out until the sidecars exist) ---
  #
  # promptgen:
  #   build: ./sidecars/promptgen        # POST /generate {analysis} -> {prompt}
  #   ports: ['9101:9101']
  #
  # imagegen:
  #   build: ./sidecars/imagegen         # POST /generate {prompt}   -> {imageUrl}
  #   ports: ['9102:9102']

volumes:
  # `pg-data` is a named volume, but the local driver's bind options pin its
  # storage to an explicit host directory: $PWD/.data/postgres (where $PWD is the
  # directory you run `docker compose` from). This keeps the data visible and
  # easy to back up / wipe (`rm -rf .data/postgres`) instead of living in an
  # opaque /var/lib/docker/volumes/... path.
  #
  # NOTE: with `type: none` + `o: bind`, the host directory must already exist
  # before the first `docker compose up`:  mkdir -p .data/postgres
  pg-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/.data/postgres

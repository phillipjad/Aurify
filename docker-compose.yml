# Local development services for Aurify.
#
# Start these through ./start_container.sh, not `docker compose` directly: it
# guards the PostgreSQL bind-mount source directory (see the volumes note at the
# bottom of this file) and passes service names straight through.
#
#   ./start_container.sh -dm postgres mailpit   # dependencies only
#   ./start_container.sh -mb                    # the whole stack, rebuilt
#
# There are no model services here. Prompt generation talks to Ollama running
# natively on the host, since Docker on macOS cannot reach Metal, and image
# generation calls Together AI. With neither configured the backend
# renders deterministic placeholders, so the API runs with no setup at all.
# See docs/adr/0016-generation-providers.md.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    # Layered configuration, lowest precedence first. Compose applies env_file
    # entries in order and a later file wins, so this reads as:
    #
    #   .env.default  committed defaults, the baseline every stack runs with
    #   .env.dev      the shared local development preset (gitignored)
    #   .env          personal overrides, highest precedence (gitignored)
    #
    # Every entry is optional. With none of them present the API applies
    # production rules and refuses to start without a mail relay and a signing
    # key, which is the correct behaviour for anything that is not a dev box.
    #
    # .env.default is committed and genuinely loaded, which is why it is named
    # "default" rather than "example": editing it changes what every developer's
    # stack runs with, so it is code rather than a comment.
    env_file:
      - path: backend/.env.default
        required: false
      - path: backend/.env.dev
        required: false
      - path: backend/.env
        required: false
    # Wins over every env_file above, which is deliberate: .env.default points
    # the database at localhost, correct for running the API outside Docker but
    # wrong inside the container, where it must be the compose service hostname.
    environment:
      AURIFY_DATABASE_URL: postgres://aurify:aurify@postgres:5432/aurify?sslmode=disable
      AURIFY_HTTP_ADDR: :8080
    extra_hosts:
      # So AURIFY_PROMPTGEN_URL can name host.docker.internal to reach Ollama,
      # which runs natively on the host rather than as a service here: Docker on
      # macOS cannot reach Metal, so a containerized model would fall back to
      # CPU. Docker Desktop provides this name already; Linux does not.
      - 'host.docker.internal:host-gateway'
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Mailpit is a real SMTP server that captures everything sent to it and exposes
  # a web UI on 8025 plus a REST API for tests.
  #
  # It exists so development substitutes infrastructure rather than branching the
  # application. The API speaks ordinary SMTP to it exactly as it speaks to
  # SMTP2GO in production, so the verification and password-reset paths that run
  # locally are the same code that runs for real users, and an integration test
  # can read the token out of the API instead of needing a back door.
  mailpit:
    image: axllent/mailpit:latest
    container_name: aurify-mailpit
    restart: unless-stopped
    ports:
      - '8025:8025' # web UI and REST API
      - '1025:1025' # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # The integration tests need their own database and refuse to run against this
  # one, because they truncate every table. Create it once:
  #
  #   docker compose exec postgres createdb -U aurify aurify_test
  #   export AURIFY_TEST_DATABASE_URL=postgres://aurify:aurify@localhost:5432/aurify_test?sslmode=disable
  #
  # Without that variable the integration tests skip, so `go test ./...` still
  # passes on a machine with no database.
  postgres:
    image: postgres:17
    container_name: aurify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurify
      POSTGRES_USER: aurify
      POSTGRES_PASSWORD: aurify
    ports:
      - '5432:5432'
    volumes:
      # Named volume, but bound to an explicit host directory — see the
      # top-level `volumes:` block at the bottom of this file.
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aurify -d aurify']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # `pg-data` is a named volume, but the local driver's bind options pin its
  # storage to an explicit host directory: $PWD/.data/postgres (where $PWD is the
  # directory you run `docker compose` from). This keeps the data visible and
  # easy to back up / wipe (`rm -rf .data/postgres`) instead of living in an
  # opaque /var/lib/docker/volumes/... path.
  #
  # NOTE: with `type: none` + `o: bind`, the host directory must already exist
  # before the first `docker compose up`:  mkdir -p .data/postgres
  pg-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/.data/postgres

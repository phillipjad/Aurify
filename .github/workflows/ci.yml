name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

  build-backend:
    runs-on: ubuntu-latest
    needs: version
    # The integration tests skip themselves when AURIFY_TEST_DATABASE_URL is
    # unset, so without this service they would quietly never run anywhere.
    # Migrations are applied by the code under test, via postgres.Connect.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aurify_test
          POSTGRES_USER: aurify
          POSTGRES_PASSWORD: aurify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurify -d aurify_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: cd backend && go vet ./...

      - name: Test
        env:
          AURIFY_TEST_DATABASE_URL: postgres://aurify:aurify@localhost:5432/aurify_test?sslmode=disable
        run: cd backend && go test ./...

      - name: Build
        working-directory: backend
        env:
          VERSION: ${{ needs.version.outputs.semVer }}
        run: go run build.go

  typecheck-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-vp rather than pnpm/action-setup plus actions/setup-node: vp is the
      # toolchain, and it carries its own vitest, oxlint, oxfmt and bundler, so
      # installing a package manager and a Node separately only set up the thing
      # that fetches it. The version still comes from frontend/package.json, which
      # keeps one pin in the repo for dependabot to bump, and run-install (on by
      # default) does `vp install`.
      - uses: voidzero-dev/setup-vp@v1
        with:
          version-file: frontend/package.json
          working-directory: frontend
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Check (format, lint, types)
        run: cd frontend && vp check

      # --run is explicit rather than relying on Vitest inferring CI and
      # disabling watch mode. If that inference ever fails the job hangs until
      # the runner times out, which is a slow and confusing way to learn it.
      - name: Test
        run: cd frontend && vp test --run

      # Completes the sequence AGENTS.md documents: check, test, build. Neither
      # check nor test bundles anything, so a production-only failure — a bad
      # dynamic import, an asset the PWA plugin cannot resolve — passes both.
      # build-images compiles this too, inside the image, but this fails in about
      # a minute against several, and points at the frontend rather than at a
      # Docker layer.
      - name: Build
        run: cd frontend && vp build

  # Builds every image docker-compose.yml declares, which today is the backend
  # and its embedded SPA. Nothing else in CI compiles the Dockerfile: the Go and
  # frontend jobs work from a full checkout, so a COPY that misses a build input
  # passes them and fails only here or in a deploy.
  #
  # That is not hypothetical. The frontend install reads a patch file declared in
  # pnpm-workspace.yaml, the Dockerfile copied the manifests without it, and the
  # image had been unbuildable while every other job stayed green.
  #
  # `compose build` rather than a `docker build` line so this keeps covering the
  # file as it grows: a second buildable service is picked up without editing CI.
  # It also runs the production frontend build, which nothing else here does.
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build every image the compose file declares
        run: docker compose build

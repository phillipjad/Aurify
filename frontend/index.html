<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="description" content="Generate album/playlist covers that capture the vibe of your music." />

    <!-- Resolve the theme before first paint to avoid a light/dark flash.
         Mirrors src/lib/theme.ts (key + class). -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('aurify-theme')
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* default to the :root (light) tokens if storage is unavailable */
        }
      })()
    </script>

    <!-- Fonts are self-hosted via @fontsource (see src/main.tsx): no
         render-blocking round trip to Google, and they work offline in the PWA. -->
    <title>Aurify</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

openapi: 3.1.0
info:
  title: Aurify API
  description: Generate abstract covers from a playlist's audio features and lyric sentiment.
  version: dev
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
paths:
  /api/v1/auth/{platform}/callback:
    get:
      tags:
        - aurify
      summary: OAuth callback that links a DSP account to the user
      operationId: dspCallback
      parameters:
        - name: platform
          in: path
          description: 'DSP platform: spotify, apple_music, youtube_music'
          required: true
          schema:
            type: string
          example: spotify
        - name: code
          in: query
          description: OAuth authorization code from the provider
          required: true
          schema:
            type: string
          example: AQD...
        - name: state
          in: query
          description: Opaque value echoed back by the provider
          schema:
            type: string
          example: xY...
      responses:
        "302":
          description: Response 302
  /api/v1/auth/{platform}/login:
    get:
      tags:
        - aurify
      summary: Redirect to a DSP to begin linking the account
      operationId: dspLogin
      parameters:
        - name: platform
          in: path
          description: 'DSP platform: spotify, apple_music, youtube_music'
          required: true
          schema:
            type: string
          example: spotify
      responses:
        "302":
          description: Response 302
  /api/v1/auth/federated/google/callback:
    get:
      tags:
        - aurify
      summary: Complete federated sign-in and start a session
      operationId: googleSignInCallback
      parameters:
        - name: code
          in: query
          description: Authorization code from Google
          schema:
            type: string
          example: 4/0A...
        - name: state
          in: query
          description: Opaque value echoed back by Google
          schema:
            type: string
          example: xY...
      responses:
        "302":
          description: Response 302
        "501":
          description: Response 501
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: ""
  /api/v1/auth/federated/google/start:
    get:
      tags:
        - aurify
      summary: Redirect to Google to begin federated sign-in
      operationId: googleSignInStart
      parameters:
        - name: return
          in: query
          description: Path within the app to return to afterwards
          schema:
            type: string
          example: /covers
      responses:
        "302":
          description: Response 302
        "501":
          description: Response 501
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: ""
  /api/v1/auth/password/forgot:
    post:
      tags:
        - aurify
      summary: Send a password reset link
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              email: ""
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: ""
  /api/v1/auth/password/reset:
    post:
      tags:
        - aurify
      summary: Set a new password using a reset token
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              token: ""
              newpassword: ""
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: ""
  /api/v1/auth/refresh:
    post:
      tags:
        - aurify
      summary: Rotate the refresh token and reissue the session
      operationId: refreshSession
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                userid: ""
                email: ""
                displayname: ""
                emailverified: false
                connections: []
                csrftoken: ""
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: ""
                title: ""
                status: 0
                detail: ""
                instance: null
  /api/v1/auth/session:
    get:
      tags:
        - aurify
      summary: Describe the signed-in user
      operationId: getSession
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                userid: ""
                email: ""
                displayname: ""
                emailverified: false
                connections: []
                csrftoken: ""
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: ""
                title: ""
                status: 0
                detail: ""
                instance: null
  /api/v1/auth/signin:
    post:
      tags:
        - aurify
      summary: Authenticate and start a session
      operationId: signIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            example:
              email: ""
              password: ""
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                userid: ""
                email: ""
                displayname: ""
                emailverified: false
                connections: []
                csrftoken: ""
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: ""
                title: ""
                status: 0
                detail: ""
                instance: null
  /api/v1/auth/signout:
    post:
      tags:
        - aurify
      summary: Revoke the current session
      operationId: signOut
      responses:
        "204":
          description: No Content
  /api/v1/auth/signup:
    post:
      tags:
        - aurify
      summary: Register an email/password account
      operationId: signUp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            example:
              email: ""
              password: ""
              displayname: ""
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: ""
        "409":
          description: Response 409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: ""
                title: ""
                status: 0
                detail: ""
                instance: null
  /api/v1/auth/verify-email:
    post:
      tags:
        - aurify
      summary: Confirm an email address using an emailed token
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            example:
              token: ""
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: ""
  /api/v1/covers:
    get:
      tags:
        - aurify
      summary: List the current user's covers, one per playlist, newest first
      operationId: listCovers
      parameters:
        - name: status
          in: query
          description: Filter to one lifecycle status (empty = all)
          schema:
            type: string
          example: ready
        - name: limit
          in: query
          description: Page size (default 20, max 100)
          schema:
            type: string
          example: "20"
        - name: before
          in: query
          description: 'Keyset cursor: the previous page''s last updatedAt'
          schema:
            type: string
          example: "2026-08-09T12:00:00Z"
        - name: before_id
          in: query
          description: 'Keyset cursor: the previous page''s last id'
          schema:
            type: string
          example: 0f8fad5b-d9cb-469f-a165-70867728950e
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoverResponse'
              example: []
    post:
      tags:
        - aurify
      summary: Start generating a cover for a playlist; subscribe to its events for progress
      operationId: generateCover
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateCoverRequest'
            example:
              platform: ""
              playlistid: ""
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverResponse'
              example:
                id: ""
                status: ""
                platform: ""
                playlistid: ""
                playlistname: ""
                imageurl: ""
                palette: []
                error: ""
                runcount: 0
                revisions: []
                createdat: ""
                updatedat: ""
        "409":
          description: Response 409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: ""
                title: ""
                status: 0
                detail: ""
                instance: null
  /api/v1/covers/{id}:
    get:
      tags:
        - aurify
      summary: Get a cover by id, with its run history
      operationId: getCover
      parameters:
        - name: id
          in: path
          description: Cover id
          required: true
          schema:
            type: string
          example: 0f8fad5b-d9cb-469f-a165-70867728950e
        - name: allow_failed_revisions
          in: query
          description: Include runs that produced no artwork
          schema:
            type: string
          example: "true"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverResponse'
              example:
                id: ""
                status: ""
                platform: ""
                playlistid: ""
                playlistname: ""
                imageurl: ""
                palette: []
                error: ""
                runcount: 0
                revisions: []
                createdat: ""
                updatedat: ""
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: ""
                title: ""
                status: 0
                detail: ""
                instance: null
    delete:
      tags:
        - aurify
      summary: Delete a cover and every run it has had
      operationId: deleteCover
      parameters:
        - name: id
          in: path
          description: Cover id
          required: true
          schema:
            type: string
          example: 0f8fad5b-d9cb-469f-a165-70867728950e
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: ""
                title: ""
                status: 0
                detail: ""
                instance: null
  /api/v1/covers/{id}/events:
    get:
      tags:
        - aurify
      summary: Stream a cover's lifecycle over Server-Sent Events until it is terminal
      operationId: streamCoverEvents
      parameters:
        - name: id
          in: path
          description: Cover id
          required: true
          schema:
            type: string
          example: 0f8fad5b-d9cb-469f-a165-70867728950e
      responses:
        "200":
          description: Success
  /api/v1/covers/{id}/image:
    get:
      tags:
        - aurify
      summary: Serve one generation run's image bytes
      operationId: getCoverImage
      parameters:
        - name: id
          in: path
          description: Revision id, as carried by any imageUrl
          required: true
          schema:
            type: string
          example: 0f8fad5b-d9cb-469f-a165-70867728950e
      responses:
        "200":
          description: Success
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: ""
                title: ""
                status: 0
                detail: ""
                instance: null
  /api/v1/covers/{id}/push:
    post:
      tags:
        - aurify
      summary: Set this cover as the playlist's artwork on its DSP
      operationId: setPlaylistCover
      parameters:
        - name: id
          in: path
          description: Cover id
          required: true
          schema:
            type: string
          example: 0f8fad5b-d9cb-469f-a165-70867728950e
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: ""
                title: ""
                status: 0
                detail: ""
                instance: null
        "422":
          description: Response 422
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: ""
                title: ""
                status: 0
                detail: ""
                instance: null
  /api/v1/covers/{id}/revisions/{revisionId}:
    delete:
      tags:
        - aurify
      summary: Delete one generation run, keeping the cover
      operationId: deleteCoverRevision
      parameters:
        - name: id
          in: path
          description: Cover id
          required: true
          schema:
            type: string
          example: 0f8fad5b-d9cb-469f-a165-70867728950e
        - name: revisionId
          in: path
          description: Revision id
          required: true
          schema:
            type: string
          example: 9d3c1e2a-0b44-4b7e-8a71-1c5f0e2d3a84
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: ""
                title: ""
                status: 0
                detail: ""
                instance: null
  /api/v1/playlists:
    get:
      tags:
        - aurify
      summary: List the current user's playlists for a DSP
      operationId: listPlaylists
      parameters:
        - name: platform
          in: query
          description: DSP platform
          required: true
          schema:
            type: string
          example: spotify
        - name: q
          in: query
          description: Case-insensitive search over name and description
          schema:
            type: string
          example: coffee
        - name: sort
          in: query
          description: 'Ordering: name or tracks'
          schema:
            type: string
          example: name
        - name: limit
          in: query
          description: Page size (default 20, max 100)
          schema:
            type: string
          example: "20"
        - name: offset
          in: query
          description: Rows to skip
          schema:
            type: string
          example: "0"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaylistResponse'
              example: []
components:
  schemas:
    ColorWeightResponse:
      type: object
      properties:
        dimension:
          type: string
        hexColor:
          type: string
        weight:
          type: number
      required:
        - dimension
        - hexColor
        - weight
    CoverResponse:
      type: object
      properties:
        createdAt:
          type: string
        error:
          type: string
        id:
          type: string
        imageUrl:
          type: string
        palette:
          type: array
          items:
            $ref: '#/components/schemas/ColorWeightResponse'
        platform:
          type: string
          enum:
            - spotify
            - apple_music
            - youtube_music
        playlistId:
          type: string
        playlistName:
          type: string
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/CoverRevisionResponse'
        runCount:
          type: integer
        status:
          type: string
          enum:
            - pending
            - analyzing
            - generating
            - ready
            - failed
        updatedAt:
          type: string
      required:
        - id
        - status
        - platform
        - playlistId
        - playlistName
        - runCount
        - createdAt
        - updatedAt
    CoverRevisionResponse:
      type: object
      properties:
        completedAt:
          type: string
        error:
          type: string
        id:
          type: string
        imageUrl:
          type: string
        number:
          type: integer
        palette:
          type: array
          items:
            $ref: '#/components/schemas/ColorWeightResponse'
        status:
          type: string
          enum:
            - ready
            - failed
      required:
        - id
        - number
        - status
        - completedAt
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
    GenerateCoverRequest:
      type: object
      properties:
        platform:
          type: string
          enum:
            - spotify
            - apple_music
            - youtube_music
        playlistId:
          type: string
      required:
        - platform
        - playlistId
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    PlaylistResponse:
      type: object
      properties:
        description:
          type: string
        id:
          type: string
        imageUrl:
          type: string
        name:
          type: string
        platform:
          type: string
          enum:
            - spotify
            - apple_music
            - youtube_music
        trackCount:
          type: integer
      required:
        - id
        - platform
        - name
        - description
        - trackCount
    ProblemDetails:
      type: object
      properties:
        detail:
          type: string
        instance:
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          type: string
    ResetPasswordRequest:
      type: object
      properties:
        newPassword:
          type: string
        token:
          type: string
    SessionResponse:
      type: object
      properties:
        connections:
          type: array
          items:
            type: string
        csrfToken:
          type: string
        displayName:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        userId:
          type: string
    SignInRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    SignUpRequest:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string
        password:
          type: string
    TokenRequest:
      type: object
      properties:
        token:
          type: string

openapi: 3.1.0
info:
  title: Aurify API
  description: Generate abstract covers from a playlist's audio features and lyric sentiment.
  version: dev
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
paths:
  /api/v1/auth/{platform}/callback:
    get:
      tags:
        - aurify
      summary: OAuth callback that links a DSP account to the user
      operationId: dspCallback
      parameters:
        - name: platform
          in: path
          description: 'DSP platform: spotify, apple_music, youtube_music'
          required: true
          schema:
            type: string
          example: spotify
        - name: code
          in: query
          description: OAuth authorization code from the provider
          required: true
          schema:
            type: string
          example: AQD...
      responses:
        "200":
          description: Success
  /api/v1/auth/{platform}/login:
    get:
      tags:
        - aurify
      summary: Get the OAuth authorization URL for a DSP
      operationId: dspLogin
      parameters:
        - name: platform
          in: path
          description: 'DSP platform: spotify, apple_music, youtube_music'
          required: true
          schema:
            type: string
          example: spotify
      responses:
        "200":
          description: Success
  /api/v1/covers:
    get:
      tags:
        - aurify
      summary: List covers generated by the current user
      operationId: listCovers
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoverResponse'
              example: []
    post:
      tags:
        - aurify
      summary: Analyze a playlist and generate a cover
      operationId: generateCover
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateCoverRequest'
            example:
              platform: ""
              playlistid: ""
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverResponse'
              example:
                id: ""
                status: ""
                platform: ""
                playlistid: ""
                playlistname: ""
                imageurl: ""
                prompt: ""
                palette: []
                error: ""
                createdat: ""
  /api/v1/covers/{id}:
    get:
      tags:
        - aurify
      summary: Get a generated cover by id
      operationId: getCover
      parameters:
        - name: id
          in: path
          description: Cover id
          required: true
          schema:
            type: string
          example: "000000000000000000000000"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverResponse'
              example:
                id: ""
                status: ""
                platform: ""
                playlistid: ""
                playlistname: ""
                imageurl: ""
                prompt: ""
                palette: []
                error: ""
                createdat: ""
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: ""
                title: ""
                status: 0
                detail: ""
                instance: null
    delete:
      tags:
        - aurify
      summary: Delete a generated cover
      operationId: deleteCover
      parameters:
        - name: id
          in: path
          description: Cover id
          required: true
          schema:
            type: string
          example: "000000000000000000000000"
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: ""
                title: ""
                status: 0
                detail: ""
                instance: null
  /api/v1/playlists:
    get:
      tags:
        - aurify
      summary: List the current user's playlists for a DSP
      operationId: listPlaylists
      parameters:
        - name: platform
          in: query
          description: DSP platform
          required: true
          schema:
            type: string
          example: spotify
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaylistResponse'
              example: []
components:
  schemas:
    ColorWeightResponse:
      type: object
      properties:
        dimension:
          type: string
        hexColor:
          type: string
        weight:
          type: number
      required:
        - dimension
        - hexColor
        - weight
    CoverResponse:
      type: object
      properties:
        createdAt:
          type: string
        error:
          type: string
        id:
          type: string
        imageUrl:
          type: string
        palette:
          type: array
          items:
            $ref: '#/components/schemas/ColorWeightResponse'
        platform:
          type: string
          enum:
            - spotify
            - apple_music
            - youtube_music
        playlistId:
          type: string
        playlistName:
          type: string
        prompt:
          type: string
        status:
          type: string
          enum:
            - pending
            - analyzing
            - generating
            - ready
            - failed
      required:
        - id
        - status
        - platform
        - playlistId
        - playlistName
        - createdAt
    GenerateCoverRequest:
      type: object
      properties:
        platform:
          type: string
          enum:
            - spotify
            - apple_music
            - youtube_music
        playlistId:
          type: string
      required:
        - platform
        - playlistId
    PlaylistResponse:
      type: object
      properties:
        description:
          type: string
        id:
          type: string
        imageUrl:
          type: string
        name:
          type: string
        platform:
          type: string
          enum:
            - spotify
            - apple_music
            - youtube_music
        trackCount:
          type: integer
      required:
        - id
        - platform
        - name
        - description
        - trackCount
    ProblemDetails:
      type: object
      properties:
        detail:
          type: string
        instance:
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          type: string

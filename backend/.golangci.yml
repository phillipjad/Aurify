# golangci-lint configuration for the Aurify backend.
# Run with: golangci-lint run ./...
version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - revive
    - misspell
    - bodyclose
    - errorlint
    - unconvert
    - prealloc

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/phillipjad/aurify/backend

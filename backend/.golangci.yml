# golangci-lint configuration for the Aurify backend.
# Run with: golangci-lint run ./...
version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - revive
    - misspell
    - bodyclose
    - errorlint
    - unconvert
    - prealloc

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
    - golines
  settings:
    goimports:
      local-prefixes:
        - github.com/phillipjad/aurify/backend
    golines:
      # Shorten lines longer than this (apply with `golangci-lint fmt`).
      max-len: 120
      # Tab width used when measuring line length.
      tab-len: 4
      # Don't try to wrap comments — golines can't always do so sensibly.
      shorten-comments: false
      # Reformat/realign struct tags.
      reformat-tags: true
